name: crawl

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run crawler
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: node src/main.js

      - name: Commit updated feed + images
        env:
          GH_PUSH_TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
        run: |
          git config user.name "ai-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: update curated feed $(date -u +%Y-%m-%dT%H:%MZ)"
            git push https://x-access-token:${GH_PUSH_TOKEN}@github.com/${{ github.repository }}.git HEAD:main
          fi